<!--
  Narrows — Confirm signup email (boater app)
  Paste this into: Supabase Dashboard → Authentication → Email Templates → Confirm signup
  Subject line field, separately: "Confirm your Narrows account"

  Supabase variable used: {{ .Token }} — the 6-digit code the boater types
  into ConfirmEmailScreen.tsx. Same table-based/inline-style approach as
  magic-link.html — see that file's header comment for why.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm your Narrows account</title>
</head>
<body style="margin:0; padding:0; background-color:#000000; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#000000;">
    <tr>
      <td align="center" style="padding: 40px 16px;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#1C1C1E; border-radius:16px; overflow:hidden;">

          <!-- Wordmark -->
          <tr>
            <td align="center" style="padding: 40px 32px 24px 32px;">
              <span style="font-size:22px; font-weight:700; letter-spacing:1px; color:#C2A24E;">NARROWS</span>
            </td>
          </tr>

          <!-- Headline + body -->
          <tr>
            <td style="padding: 0 32px;">
              <h1 style="margin:0 0 12px 0; font-size:20px; line-height:28px; font-weight:700; color:#F5F0E8; text-align:center;">
                Confirm your account
              </h1>
              <p style="margin:0 0 28px 0; font-size:14px; line-height:21px; color:#8E8E93; text-align:center;">
                Enter this code in the app to finish creating your account.
              </p>
            </td>
          </tr>

          <!-- Code -->
          <tr>
            <td align="center" style="padding: 0 32px 32px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="border-radius:12px; background-color:#2C2C2E; padding:20px 32px;">
                    <span style="font-size:32px; font-weight:700; letter-spacing:8px; color:#C2A24E;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:16px 0 0 0; font-size:12px; line-height:18px; color:#8E8E93; text-align:center;">
                This code expires shortly and can only be used once.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 24px 32px 32px 32px; border-top:1px solid #2C2C2E;">
              <p style="margin:0; font-size:12px; line-height:18px; color:#8E8E93; text-align:center;">
                Didn't create a Narrows account? You can safely ignore this email.
              </p>
              <p style="margin:12px 0 0 0; font-size:12px; line-height:18px; color:#8E8E93; text-align:center;">
                Narrows · Simcoe County, Ontario · <a href="https://narrows.site" style="color:#8E8E93;">narrows.site</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
