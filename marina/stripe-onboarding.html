    el.innerHTML =
      '<div class="icon">&#9203;</div>' +
      '<h1>Let\'s finish setting up your payouts</h1>' +
      '<p>Open the Narrows app and tap <strong>Connect with Stripe</strong> on your Home screen again to pick up where you left off. Stripe saves your progress, so you won\'t need to start over.</p>';
